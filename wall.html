<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVISION · Shared tree</title><style>body{margin:0;background:#f7f6fc;color:#11152f;font:16px Aptos,Arial}.top{background:#080d38;color:#fff;padding:22px 5vw;display:flex;justify-content:space-between}.tag{color:#ffd033;font-size:.78rem;font-weight:bold;letter-spacing:.12em}h1{margin:6px 0 0;font-size:2.3rem}.wrap{padding:24px 5vw}.intro{display:flex;gap:24px;align-items:center;background:#fff;border-radius:18px;padding:18px 22px}.intro img{width:112px}.intro p{font-size:1.15rem;line-height:1.4}.actions{margin-left:auto}.actions button{border:0;border-radius:8px;background:#7133c8;color:#fff;padding:11px 14px;margin:4px;font-weight:bold}.actions .danger{background:#e41e34}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.cat{background:#fff;border-radius:14px;border-left:8px solid #1f5ae8;padding:18px;min-height:160px}.cat:nth-child(2){border-color:#7133c8}.cat:nth-child(3){border-color:#008a50}.cat:nth-child(4){border-color:#e41e34}h2{margin:0}.count,.status,.empty{color:#64708a}.cluster{background:#eee9ff;border-radius:10px;padding:10px 13px;margin-top:10px}.cluster b{color:#58269b}.examples{font-size:.9rem;color:#4b5170;margin-top:5px}.raw{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.raw span{background:#eaf3ff;border-radius:999px;padding:6px 9px;font-size:.9rem}@media(max-width:700px){.grid{grid-template-columns:1fr}.intro{flex-wrap:wrap}.actions{margin:0}}</style><header class="top"><div><div class="tag">AI VISION · YOUTH EXCHANGE</div><h1>Our shared tree</h1></div><div class="status" id="status">Loading…</div></header><main class="wrap"><section class="intro"><img id="qr"><p><b>Scan to add a leaf.</b><br>One short, anonymous idea. The AI will reveal the shared themes.</p><div class="actions"><button onclick="cluster()">Group with AI</button><button class="danger" onclick="resetWall()">Reset</button></div></section><section class="grid" id="grid"></section></main><script>const s=new URLSearchParams(location.search).get('s')||'aivision-2026',cats=['Expectation','Need','Contribution','Question or concern'];let state={},token=sessionStorage.aivisionAdmin||'';qr.src=`/api/qr?url=${encodeURIComponent(location.origin+'/?s='+s)}`;const esc=x=>String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){let out='';for(const c of cats){const r=state.responses.filter(x=>x.category===c),g=(state.clusters||[]).filter(x=>x.category===c);out+=`<article class="cat"><h2>${c} <span class="count">${r.length}</span></h2>`+(g.length?g.map(x=>`<div class="cluster"><b>${esc(x.title)} · ${x.count}</b><div>${esc(x.summary)}</div><div class="examples">${(x.examples||[]).map(esc).join(' · ')}</div></div>`).join(''):r.length?`<div class="raw">${r.map(x=>`<span>${esc(x.text)}</span>`).join('')}</div>`:'<p class="empty">No leaf yet.</p>')+'</article>'}grid.innerHTML=out;status.textContent=`${state.responses.length} leaf${state.responses.length!==1?'ves':''} · ${state.aiReady?'AI ready':'AI not configured'}`}async function refresh(){state=await(await fetch(`/api/state?s=${s}`)).json();render()}async function guarded(path){if(!token){token=prompt('Facilitator password:')||'';sessionStorage.aivisionAdmin=token}let r=await fetch(`${path}?s=${s}`,{method:'POST',headers:{'x-admin-token':token}});if(!r.ok)alert((await r.json()).error);refresh()}function cluster(){guarded('/api/cluster')}function resetWall(){if(confirm('Delete all answers?'))guarded('/api/reset')}refresh();setInterval(refresh,5000);</script></html>
