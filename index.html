<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVISION · Your leaf</title><style>body{margin:0;background:#080d38;color:#fff;font:16px Aptos,Arial;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,88vw)}.tag{color:#ffd033;font-weight:700;letter-spacing:.14em;font-size:.8rem}h1{font-size:2.3rem;margin:8px 0}p{color:#ddd3ff;line-height:1.5}form{background:#fff;color:#11152f;border-radius:20px;padding:24px;margin-top:22px}label{display:block;font-weight:700;margin:14px 0 7px}select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:10px}select,textarea{border:1px solid #c9c5db}textarea{height:115px;resize:none}button{border:0;background:#1f5ae8;color:#fff;font-weight:700;margin-top:16px}.hint{color:#64708a;font-size:.85rem}.ok{display:none;background:#d9f7e8;color:#075c33;border-radius:10px;padding:12px;margin-top:14px;font-weight:700}</style><main class="box"><div class="tag">AI VISION · YOUTH EXCHANGE</div><h1>Add your leaf</h1><p>One short, anonymous and honest idea. Together, we will make our shared priorities visible.</p><form id="form"><label for="category">My leaf belongs to…</label><select id="category"><option>Expectation</option><option>Need</option><option>Contribution</option><option>Question or concern</option></select><label for="text">My idea <span class="hint">(8–20 words if possible)</span></label><textarea id="text" maxlength="180" required placeholder="For example: I want to learn how to create images without stereotypes."></textarea><div class="hint"><span id="n">0</span>/180 · No names or personal data.</div><button>Add to the tree</button><div class="ok" id="ok">Thank you — your leaf has been added.</div></form></main><script>const s=new URLSearchParams(location.search).get('s')||'aivision-2026',t=text,ok=document.querySelector('#ok');t.oninput=()=>n.textContent=t.value.length;form.onsubmit=async e=>{e.preventDefault();let r=await fetch(`/api/responses?s=${encodeURIComponent(s)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:category.value,text:t.value})});if(!r.ok)return alert((await r.json()).error);t.value='';n.textContent=0;ok.style.display='block';setTimeout(()=>ok.style.display='none',3500)};</script></html>
