<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIVISION · The vote, live</title><meta name="robots" content="noindex"><style>
:root{--ink:#171d48;--yel:#facc15;--bg:#f4f4f9;--mut:#6b6f93;--vio:#6d28d9;--card:#fff;--line:#e1e3ef;--soft:#f2f3fa;--dim:#e9eaf3;--amber:#b45309}
*{box-sizing:border-box} html,body{margin:0} body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.wrap{max-width:960px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px))}
header.top{background:var(--ink);color:#fff;padding:20px 0 16px} header.top h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1} header.top p{margin:8px 0 0;color:#d8daf0;font-size:14px}
.k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--yel)}
.n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--yel);align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--ink)} .n.big{width:36px;height:36px;font-size:17px;flex:none}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.04em} .pill.open{background:#dcfce7;color:#14532d} .pill.closed{background:#fde68a;color:#7c2d12}
button.main,a.main{font:inherit;font-weight:800;padding:12px 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block} button.main:disabled{background:#c9cbe0;cursor:default} button.sec,a.sec{font:inherit;font-weight:700;padding:10px 12px;border-radius:999px;border:1px solid #c9cbe0;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
.msg{background:#fde68a;color:#7c2d12;padding:10px 12px;border-radius:12px;margin:12px auto 0;font-weight:700;display:none}
.foot{text-align:center;font-size:12px;color:var(--mut);padding:20px 12px} .foot a{color:var(--vio)}

.top .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px;font-size:14px;color:#d8daf0} .top .row b{color:#fff;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:#fff}
.grid6{display:grid;grid-template-columns:1fr;gap:12px;margin:14px auto} @media(min-width:760px){.grid6{grid-template-columns:1fr 1fr}} @media(min-width:1180px){.grid6{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border-radius:16px;padding:12px;min-width:0} .card .sh{display:flex;gap:10px;align-items:center} .card h2{margin:0;font-size:22px} .card .sub{font-size:12px;color:var(--mut);margin-left:auto;text-align:right}
.rows{margin-top:10px;display:grid;gap:6px} .r{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center} .r img{width:44px;height:58px;object-fit:cover;border-radius:6px;background:var(--dim)} .r .lab{font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center} .r .lab small{font-weight:700;color:var(--mut);font-size:11px}
.r .b{height:12px;background:var(--dim);border-radius:6px;overflow:hidden;margin-top:3px} .r .b i{display:block;height:100%;background:#c9cbe0} .r.top .b i{background:var(--vio)} .r.tie .b i{background:#f59e0b} .r .v{text-align:right;font-weight:800;font-size:16px} .r .v small{display:block;font-weight:600;font-size:10px;color:var(--mut)}
.r.top .lab{color:var(--vio)} .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--vio)} .r.tie .tag{color:var(--amber)}
.note{font-size:12px;color:var(--amber);margin:8px 0 0;font-weight:700}
.admin{background:var(--card);border-radius:16px;padding:14px;margin:14px auto;display:none} .admin.on{display:block} .admin input{font:inherit;padding:10px;border:1px solid #c9cbe0;border-radius:10px;width:220px;max-width:100%} .admin .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px} .admin textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-top:10px;border:1px solid #c9cbe0;border-radius:10px;padding:8px}
.voters{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.7} .voters b{color:var(--ink)} .voters .dup{color:var(--amber);font-weight:800}
.tv .wrap{max-width:1500px} .tv .r img{width:52px;height:68px} .tv .card h2{font-size:26px} .tv .r .v{font-size:20px}
</style></head><body>
<header class="top"><div class="wrap"><div class="k">AIVISION · Montélimar · Our Common Worlds</div><h1>The vote, live</h1>
<div class="row"><span id="status" class="pill open">…</span><span><b id="nv">0</b> voters</span><span class="chips" id="chips"></span><span id="upd" style="margin-left:auto;font-size:12px"></span></div></div></header>
<div class="wrap"><div class="msg" id="err"></div><div class="grid6" id="grid"></div>
<div class="admin" id="admin"><h3 style="margin:0 0 6px">Facilitator</h3><p style="font-size:13px;color:var(--mut);margin:0">Close or reopen the vote, reset it, or export the ballots. The key is the one set in Vercel (VOTE_ADMIN).</p>
<div style="margin-top:8px"><input id="tok" type="password" placeholder="facilitator key"></div>
<div class="acts"><button class="main" id="bclose">Close the vote now</button><button class="sec" id="bopen">Reopen (ignore the clock)</button><button class="sec" id="bauto">Back to the clock (closes 12:15)</button><button class="sec" id="bexport">Export the ballots</button><button class="sec" id="breset" style="color:#991b1b;border-color:#fca5a5">Reset all votes</button></div>
<div id="aout" style="font-size:13px;margin-top:8px"></div><textarea id="exp" style="display:none"></textarea><div class="voters" id="voters"></div></div>
<p class="foot"><a href="vote.html">Back to the vote</a> · refreshes every 4 seconds · <a href="#admin">facilitator</a></p></div>
<script>
const S = [{"n": 1, "place": "Door", "hook": "One real door, many lives. Find what the AI added.", "real": "img/door_real.jpg", "works": [{"code": "Door 1", "num": 1, "src": "img/door_01.jpg"}, {"code": "Door 2", "num": 2, "src": "img/door_02.jpg"}, {"code": "Door 3", "num": 3, "src": "img/door_03.jpg"}, {"code": "Door 4", "num": 4, "src": "img/door_04.jpg"}, {"code": "Door 5", "num": 5, "src": "img/door_05.jpg"}, {"code": "Door 6", "num": 6, "src": "img/door_06.jpg"}, {"code": "Door 7", "num": 7, "src": "img/door_07.jpg"}, {"code": "Door 8", "num": 8, "src": "img/door_08.jpg"}, {"code": "Door 9", "num": 9, "src": "img/door_09.jpg"}, {"code": "Door 10", "num": 10, "src": "img/door_10.jpg"}], "text": ""}, {"n": 2, "place": "Gate", "hook": "The last gate left from the town walls. Our giant no longer fits.", "real": "img/gate_real.jpg", "works": [{"code": "Gate 1", "num": 1, "src": "img/gate_01.jpg"}, {"code": "Gate 2", "num": 2, "src": "img/gate_02.jpg"}, {"code": "Gate 3", "num": 3, "src": "img/gate_03.jpg"}, {"code": "Gate 4", "num": 4, "src": "img/gate_04.jpg"}, {"code": "Gate 5", "num": 5, "src": "img/gate_05.jpg"}, {"code": "Gate 6", "num": 6, "src": "img/gate_06.jpg"}], "text": "Untitled \u2014 What once felt like an entire universe has gradually become an isolating cage. While the town remains unchanged, the child grows beyond its boundaries, becoming a giant in a place that can no longer contain his ambitions. What happens when the place that raised you no longer has room for the person you are becoming?"}, {"n": 3, "place": "Rooftops", "hook": "One quiet town at sunset. Then a visitor bigger than the world.", "real": "img/rooftops_real.jpg", "works": [{"code": "Rooftops 1", "num": 1, "src": "img/rooftops_01.jpg"}, {"code": "Rooftops 2", "num": 2, "src": "img/rooftops_02.jpg"}, {"code": "Rooftops 3", "num": 3, "src": "img/rooftops_03.jpg"}, {"code": "Rooftops 4", "num": 4, "src": "img/rooftops_04.jpg"}], "text": ""}, {"n": 4, "place": "Street", "hook": "The sunflower roof is real. What did the AI add?", "real": "img/street_real.jpg", "works": [{"code": "Street 1", "num": 1, "src": "img/street_01.jpg"}, {"code": "Street 2", "num": 2, "src": "img/street_02.jpg"}, {"code": "Street 3", "num": 3, "src": "img/street_03.jpg"}, {"code": "Street 4", "num": 4, "src": "img/street_04.jpg"}, {"code": "Street 5", "num": 5, "src": "img/street_05.jpg"}, {"code": "Street 6", "num": 6, "src": "img/street_06.jpg"}], "text": "A Hideout Beneath Nature \u2014 The city hides beneath a beautiful illusion. The sunflowers create a shelter that protects people from the outside world, but they also conceal what lies beneath. The beauty above does not necessarily change the reality below; it simply makes it easier to overlook. Perhaps we use beauty not only to escape our problems, but also to disguise them."}, {"n": 5, "place": "River", "hook": "A green stream in the sun. Where did the golden light come from?", "real": "img/river_real.jpg", "works": [{"code": "River 1", "num": 1, "src": "img/river_01.jpg"}, {"code": "River 2", "num": 2, "src": "img/river_02.jpg"}, {"code": "River 3", "num": 3, "src": "img/river_03.jpg"}, {"code": "River 4", "num": 4, "src": "img/river_04.jpg"}], "text": "Where the Light Remains \u2014 The golden sky settles over the quiet town, reflected in the river below. The atmosphere grows quiet, but the water remembers the light. What remains when the day is gone?"}, {"n": 6, "place": "Towers", "hook": "The cooling towers of Cruas, seen from Mont\u00e9limar, painted as a mountain.", "real": "img/towers_real.jpg", "works": [{"code": "Towers 1", "num": 1, "src": "img/towers_01.jpg"}, {"code": "Towers 2", "num": 2, "src": "img/towers_02.jpg"}, {"code": "Towers 3", "num": 3, "src": "img/towers_03.jpg"}, {"code": "Towers 4", "num": 4, "src": "img/towers_04.jpg"}, {"code": "Towers 5", "num": 5, "src": "img/towers_05.jpg"}, {"code": "Towers 6", "num": 6, "src": "img/towers_06.jpg"}, {"code": "Towers 7", "num": 7, "src": "img/towers_07.jpg"}], "text": "The Illusion of Harmony \u2014 The beauty and the beast exist side by side, creating a fragile balance between peace and destruction. What appears beautiful and harmonious may hide something darker beneath the surface. Like the shortest and most temporary season, this harmony is fleeting, reminding us that even the most beautiful moments cannot last forever. Is this true harmony, or the beginning of destruction?"}]; const $ = s => document.querySelector(s);
if (location.search.includes('tv')) document.body.classList.add('tv');
const parisTime = iso => new Date(iso).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
let last = null;
function draw(j) {
  $('#status').className = 'pill ' + (j.closed ? 'closed' : 'open'); $('#status').textContent = j.closed ? 'Closed' : ('Open until ' + parisTime(j.closeAt));
  $('#nv').textContent = j.voters; $('#chips').innerHTML = Object.entries(j.byCountry || {}).map(([c, n]) => `<span class="chip">${c} ${n}</span>`).join('');
  $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris' });
  $('#grid').innerHTML = S.map(s => {
    const t = (j.tally && j.tally[s.place]) || {}; const rows = s.works.map(w => [w, t[w.num] || 0]).sort((a, b) => b[1] - a[1] || a[0].num - b[0].num);
    const max = Math.max(1, ...rows.map(r => r[1])); const third = rows[2] ? rows[2][1] : 0; const tie = rows[3] && third > 0 && rows[3][1] === third;
    const cast = rows.reduce((a, r) => a + r[1], 0);
    return `<div class="card"><div class="sh"><span class="n big">${s.n}</span><h2>${s.place}</h2><span class="sub">${cast} votes<br>${s.works.length} works</span></div><div class="rows">` +
      rows.map(([w, c], i) => { const top = i < 3 && c > 0; const tied = tie && c === third; return `<div class="r ${top ? 'top' : ''} ${tied ? 'tie' : ''}"><img src="${w.src}" alt=""><div><div class="lab"><span>${w.code}</span>${top ? `<span class="tag">${tied ? 'tie' : 'on the table'}</span>` : ''}</div><div class="b"><i style="width:${c / max * 100}%"></i></div></div><div class="v">${c}<small>vote${c === 1 ? '' : 's'}</small></div></div>`; }).join('') +
      `</div>${tie ? '<p class="note">Tie for third place: the station team decides at 13:15.</p>' : ''}</div>`;
  }).join('');
  if (j.voterList) { const seen = {}; j.voterList.forEach(v => { const k = (v.name + '|' + v.country).toLowerCase(); seen[k] = (seen[k] || 0) + 1; });
    $('#voters').innerHTML = '<b>Who voted:</b> ' + j.voterList.map(v => { const k = (v.name + '|' + v.country).toLowerCase(); return `<span class="${seen[k] > 1 ? 'dup' : ''}">${v.name} (${v.country.slice(0, 2).toUpperCase()})</span>`; }).join(' · ') + (Object.values(seen).some(n => n > 1) ? '<br><span class="dup">Same name twice = two phones; check with them.</span>' : ''); }
}
async function refresh() { try { const r = await fetch('api/tally?who=1', { cache: 'no-store' }); if (!r.ok) throw new Error('server ' + r.status); const j = await r.json(); $('#err').style.display = 'none'; draw(j); } catch (e) { $('#err').textContent = 'Cannot reach the server: ' + e.message + '. Retrying.'; $('#err').style.display = 'block'; } }
refresh(); setInterval(refresh, 4000);
function route() { $('#admin').classList.toggle('on', location.hash === '#admin'); } addEventListener('hashchange', route); route();
try { $('#tok').value = sessionStorage.getItem('aiv_tok') || ''; } catch (e) {}
async function act(action, confirmWord) {
  const tok = $('#tok').value.trim(); if (!tok) { $('#aout').textContent = 'Enter the facilitator key first.'; return; } try { sessionStorage.setItem('aiv_tok', tok); } catch (e) {}
  if (confirmWord) { const w = $('#aout'); if (w.dataset.armed !== action) { w.dataset.armed = action; w.innerHTML = `<b>Press "${confirmWord}" once more to confirm.</b> This cannot be undone (a copy of the ballots is kept on the server).`; return; } w.dataset.armed = ''; }
  const r = await fetch('api/vote-admin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: tok, action }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('#aout').textContent = j.error || ('Refused: ' + r.status); return; }
  if (action === 'export') { $('#exp').style.display = 'block'; $('#exp').value = JSON.stringify(j.ballots, null, 1); $('#aout').textContent = j.ballots.length + ' ballots. Select the text and copy it.'; }
  else { $('#aout').textContent = 'Done: ' + action + '. State: ' + j.state; refresh(); }
}
$('#bclose').onclick = () => act('close'); $('#bopen').onclick = () => act('open'); $('#bauto').onclick = () => act('auto'); $('#bexport').onclick = () => act('export'); $('#breset').onclick = () => act('reset', 'Reset all votes');
</script></body></html>
